[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sitediff"
version = "0.1.0"
description = "Compare the visible content of two renderings of the same page, across environments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jayakrishna Konda", email = "contact@jay739.dev" }]
keywords = ["diff", "parity", "migration", "regression", "html"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sitediff = "sitediff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sitediff"]
artifacts = ["profiles/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
