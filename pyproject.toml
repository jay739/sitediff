[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sitediff"
version = "0.1.0"
description = "Compare the visible content of two renderings of the same page, across environments."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jayakrishna Konda", email = "contact@jay739.dev" }]
keywords = ["diff", "parity", "migration", "regression", "html", "testing"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/jay739/sitediff"
Documentation = "https://github.com/jay739/sitediff/tree/main/docs"
Issues = "https://github.com/jay739/sitediff/issues"
Changelog = "https://github.com/jay739/sitediff/releases"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
# Browser capture is a last resort, needed only by sites that expose their
# values neither in the HTML, nor as embedded state, nor via a data endpoint.
# Keeping it optional means the base install stays three reviewable packages.
browser = ["playwright>=1.45"]

[project.scripts]
sitediff = "sitediff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sitediff"]
artifacts = ["sitediff/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# PLW1514 catches read_text/open without an explicit encoding. That only fails
# on Windows, where the locale codec is not UTF-8, so it is invisible locally
# until the CI matrix runs. It is a preview rule, hence the opt-in below, which
# enables that rule alone rather than the whole preview set.
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "UP", "B", "RUF", "PLW1514"]
