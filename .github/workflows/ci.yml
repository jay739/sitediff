name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes (Markdown, LICENSE, issue and discussion templates,
  # images and pages under docs/) skip the jobs below. They are skipped with a
  # job-level `if`, not paths-ignore, so required checks still pass.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # No usable base (manual run, new branch, rewritten history): build.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed"
          docs='^(.*\.md|LICENSE.*|\.github/(ISSUE_TEMPLATE|DISCUSSION_TEMPLATE)/.*|docs/.*\.(svg|png|jpe?g|gif|webp|ico|html|css))$'
          keep='^(README\.md|LICENSE|docs/.*\.md)$'
          code_files=$( { echo "$changed" | grep -vE "$docs"; [ -n "$keep" ] && echo "$changed" | grep -E "$keep"; } | grep -c . || true)
          if [ "$code_files" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping the build and test jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The matrix is not decoration: this tool claims to run anywhere, and the
    # parts most likely to break per platform (console colour, code page
    # fallback, socket behaviour) are only exercised by running there.
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" ruff

      - name: Lint
        run: ruff check sitediff tests

      - name: Test
        run: python -m pytest -q

      - name: Every bundled profile must load
        run: python -c "import pathlib,sitediff.config as c; [c.load_profile(str(p)) for p in (pathlib.Path(c.__file__).parent/'profiles').glob('*.toml')]"

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scan the runtime dependency tree
        # Scanning without acting on the result is theatre, so this fails the
        # build rather than filing a report nobody reads.
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install .
          pip-audit --progress-spinner off --skip-editable

  package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # A wheel that builds is not the same as a wheel that works. This installs
    # it clean and runs the console script, which is how the missing-profiles
    # packaging bug was caught in the first place.
    name: Wheel installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel
        run: python -m pip install --upgrade pip build && python -m build --wheel -o dist/

      - name: Install into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl

      - name: Console script and bundled profiles work
        run: |
          /tmp/clean/bin/sitediff --version
          /tmp/clean/bin/sitediff profiles | grep -q example
          /tmp/clean/bin/sitediff sources -p example | grep -q "Egress allowlist"

      - uses: actions/upload-artifact@v4
        with:
          name: sitediff-wheel
          path: dist/*.whl
