name: Feature request
description: Something the tool should be able to do and cannot
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to find out about two environments that this cannot tell you?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
      description: Including "nothing, I gave up", which is useful to know.
  - type: textarea
    id: shape
    attributes:
      label: What a solution might look like
      description: |
        Optional. Bear in mind that site-specific knowledge belongs in a
        profile rather than in the tool, so proposals that add configuration
        tend to land more easily than ones that add built-in behaviour.
