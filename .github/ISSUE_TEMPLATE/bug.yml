name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A profile that reproduces the problem is worth more than a description.
        Redact hostnames if you need to; the shape is what matters.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the output, redacted as needed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Profile
      description: The relevant part of your .toml, with hostnames redacted.
      render: toml
  - type: input
    id: version
    attributes:
      label: sitediff --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: "3.12.3, Ubuntu 24.04"
    validations:
      required: true
